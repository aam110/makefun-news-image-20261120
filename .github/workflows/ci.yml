name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p out && MAKEFUN_OUTPUT_DIR=out node main.ts && MAKEFUN_OUTPUT_DIR=out2 node main.ts && cmp out/entry.png out2/entry.png
      - run: node -e "const fs=require('fs');const b=fs.readFileSync('out/entry.png');if(b.length>1048576)throw new Error('too big: '+b.length);if(b.readUInt32BE(16)!==1024||b.readUInt32BE(20)!==1024)throw new Error('not 1024x1024');console.log('entry.png OK:',b.length,'bytes, 1024x1024')"
      - run: test -f README.md && test -f LICENSE && test -f main.ts
